name: Deploy Tundra Berry Royal Bloom

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build production app
        run: bun run build

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "."
          target: "/var/www/tundra-berry-royal-bloom"
          rm: true
          exclude: |
            .git
            .github
            node_modules

      - name: Install production dependencies and restart app
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/tundra-berry-royal-bloom
            npm ci --omit=dev
            pm2 delete tundra-berry-royal-bloom || true
            pm2 start "npm run preview -- --host 0.0.0.0 --port 8080" --name tundra-berry-royal-bloom
            pm2 save
